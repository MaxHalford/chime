name: Tests

on: [push, pull_request]

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      # GitHub's Linux runners are headless, so give ALSA a dummy sound card.
      # Without it, `aplay` exits non-zero and the synchronous tests would fail.
      - name: Set up a dummy audio device (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y alsa-utils
          sudo modprobe snd-dummy

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Run tests
        run: uv run pytest -v
