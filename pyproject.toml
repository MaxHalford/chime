[project]
name = "chime"
version = "0.8.0"
description = "Python sound notifications made easy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Max Halford", email = "maxhalford25@gmail.com" }]
keywords = ["notifications", "sound", "wav"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/MaxHalford/chime"
Repository = "https://github.com/MaxHalford/chime"

[project.scripts]
chime = "chime:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chime"]
# .wav theme assets live inside the package and must ship in the wheel (see #29).
artifacts = ["chime/themes/**/*.wav"]

[tool.hatch.build.targets.sdist]
include = ["chime", "README.md", "LICENSE"]

[tool.pytest.ini_options]
norecursedirs = ["soundboard"]
addopts = [
    "--doctest-modules",
    "--doctest-glob=README.md",
]
